<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Онлайн Шашки</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #menu, #game-container, #status { text-align: center; }
        .btn { background: #e67e22; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #d35400; }
        #board { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); border: 4px solid #444; border-radius: 4px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); margin: 15px auto; }
        .cell { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .light { background: #f0d9b5; }
        .dark { background: #b58863; }
        .piece { width: 45px; height: 45px; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 3px 6px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .white-piece { background: #ecf0f1; border: 2px solid #bdc3c7; color: #2c3e50; }
        .black-piece { background: #2c3e50; border: 2px solid #1a252f; color: #ecf0f1; }
        .selected { outline: 3px solid #f1c40f; outline-offset: -3px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Русские Шашки Online</h1>
        <p>Выберите режим игры:</p>
        <button class="btn" onclick="startGame('pvp')">Играть с другом (Online)</button>
        <button class="btn" onclick="startGame('bot')">Играть с Ботом</button>
    </div>

    <div id="game-container" class="hidden">
        <h2 id="role-info"></h2>
        <div id="status">Подключение...</div>
        <div id="board"></div>
        <button class="btn" onclick="location.reload()" style="background: #7f8c8d; font-size: 12px; padding: 6px 12px;">Выйти в меню</button>
    </div>

    <script src="client.js"></script>
</body>
</html>
