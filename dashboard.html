<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дашборд Шашек</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 30px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
    </style>
</head>
<body>
    <h1>Панель управления Шашками</h1>
    <div class="card">
        <h3>Статус сервера</h3>
        <p>Активных игровых комнат: <b id="rooms">-</b></p>
        <p>Игроков в очереди (PvP): <b id="queue">-</b></p>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('rooms').innerText = data.activeRooms;
                document.getElementById('queue').innerText = data.waitingPlayer;
            } catch(e) {}
        }
        fetchStatus();
        setInterval(fetchStatus, 2000);
    </script>
</body>
</html>
